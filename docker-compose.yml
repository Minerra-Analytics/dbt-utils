version: "3.7"
services:
  postgres:
    image: cimg/postgres:9.6
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dbt_utils_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dbt_utils_test"]
      interval: 5s
      timeout: 5s
      retries: 5
